name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .cache/eslint
          key: ${{ runner.os }}-static-bun-1.3.8-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**/*.ts', 'scripts/**/*.ts', 'eslint.config.*') }}
          restore-keys: |
            ${{ runner.os }}-static-bun-1.3.8-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-bun-1.3.8-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run verify:m056:s03
      - run: bun run check:orphaned-tests
      - run: bun run check:review-details-architecture

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.8-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.8-
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: kodiai
          POSTGRES_USER: kodiai
          POSTGRES_PASSWORD: kodiai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kodiai -d kodiai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://kodiai:kodiai@localhost:5432/kodiai
      TEST_DATABASE_URL: postgresql://kodiai:kodiai@localhost:5432/kodiai
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.8-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.8-
      - run: bun install --frozen-lockfile
      - run: bun run test:db
